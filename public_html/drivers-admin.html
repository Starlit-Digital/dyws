ssword<input name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password"><small>At least 12 characters. Leave blank to keep an existing password.</small></label><label class="dyws-checkbox"><input name="active" type="checkbox" checked> Active</label></div><p class="dyws-note" data-dyws-role-text="Finish or reassign active orders before deactivating this account.">Finish or reassign active orders before deactivating a driver.</p><button type="submit" data-dyws-role-text="Save {role}">Save driver</button></form><p id="driver-message" role="status"></p></section></div><p data-admin-error class="dyws-error" role="alert"></p></main></body></html>
