auth_basic "DYWS address service";
auth_basic_user_file /etc/nginx/dyws-geocoder.htpasswd;
limit_except GET { deny all; }
limit_req zone=dyws_geocoder_client burst=6 nodelay;
limit_req zone=dyws_geocoder_total burst=10 nodelay;
limit_req_status 429;
access_log /var/log/nginx/dyws-geocoder-access.log dyws_geocoder;
# nginx error messages can include the complete query string.
error_log /dev/null crit;
proxy_connect_timeout 2s;
proxy_read_timeout 15s;
proxy_send_timeout 5s;
proxy_pass_request_body off;
proxy_set_header Content-Length "";
proxy_set_header Authorization "";
proxy_set_header Host localhost;
proxy_set_header X-Forwarded-Proto https;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
proxy_pass http://127.0.0.1:8086;
