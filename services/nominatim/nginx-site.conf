server {
    listen 80;
    listen [::]:80;
    server_name geo.sltd.ca;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/dyws-nominatim/acme;
    }
    location / { return 308 https://geo.sltd.ca$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name geo.sltd.ca;
    ssl_certificate /etc/letsencrypt/live/geo.sltd.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo.sltd.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log /dev/null crit;
    location = /search { include /etc/nginx/snippets/dyws-geocoder-proxy.conf; }
    location = /status { include /etc/nginx/snippets/dyws-geocoder-proxy.conf; }
    location / { return 404; }
}
